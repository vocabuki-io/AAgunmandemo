name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site: queue deploys rather than cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Turns Pages on for the repository if it is not already, so the first
      # deploy does not need anyone to visit the settings page.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # vite is configured with a relative base, so the bundle works from the
      # /AAgunmandemo/ subpath a project site is served under.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Fetch the page we just published and check it is actually the built
      # one. Pages set to "deploy from a branch" happily serves the repository
      # root instead, which means the SOURCE index.html -- it references
      # /src/main.tsx, that 404s, and the site is simply black with a green
      # deploy. This turns that into a failed run that says so.
      - name: Smoke-test the published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "checking $PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 30 "$PAGE_URL" || true)
            if printf '%s' "$body" | grep -q 'assets/index-.*\.js'; then
              echo "ok: the published page references the built bundle"
              exit 0
            fi
            echo "attempt $attempt: not the built page yet, waiting..."
            sleep 10
          done
          echo "::error::The published page is not the built output."
          if printf '%s' "$body" | grep -q '/src/main.tsx'; then
            echo "::error::It references /src/main.tsx, i.e. the unbuilt source index.html."
            echo "::error::Settings -> Pages -> Source is set to a branch; it must be 'GitHub Actions'."
          fi
          printf '%s' "$body" | head -c 2000
          exit 1
