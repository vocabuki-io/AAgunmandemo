name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run: verify takes several minutes and
# there is no value in finishing a run for a commit nobody is looking at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # verify drives a real browser through 24 scenarios with a software
    # renderer, which is slow by nature -- it took ~8 minutes locally.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the browser download, so a type error fails in about a minute
      # instead of after fetching Chromium.
      - name: Typecheck and build
        run: npm run build

      # Keyed on the lockfile because the browser build has to match the
      # pinned playwright version.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Zero console errors, a per-pixel standard deviation gate on every
      # frame, and 81 assertions on real game state.
      - name: Verify
        run: npm run verify

      # The screenshots are the point of a failure here: they show what the
      # game actually drew.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14
