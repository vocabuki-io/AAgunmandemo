<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA GUNMAN</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07060a; }
      body { font-family: "Courier New", ui-monospace, monospace; color: #e9dfc8; cursor: crosshair; }
      canvas { display: block; }
      #boot {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 32px;
        text-align: center; letter-spacing: 0.1em; background: #07060a;
      }
      #boot-title { font-size: 12px; letter-spacing: 0.5em; color: #ff2f9e; }
      #boot-msg { font-size: 22px; color: #e9dfc8; }
      #boot-detail {
        display: none; max-width: 760px; max-height: 260px; overflow: auto;
        text-align: left; font-size: 11px; line-height: 1.6; color: #8d7f67;
        background: #120e15; border: 1px solid #33291f; padding: 14px;
        white-space: pre-wrap; word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot fallback. A module-level throw or a bundle that never executes
         leaves #root empty and the page simply black, with nothing to report.
         This says what happened instead. main.tsx removes it on mount. -->
    <div id="boot">
      <div id="boot-title">AA GUNMAN</div>
      <div id="boot-msg">LOADING…</div>
      <pre id="boot-detail"></pre>
    </div>
    <script>
      (function () {
        var shown = false
        var t0 = Date.now()
        function show(title, detail) {
          if (shown) return
          shown = true
          var b = document.getElementById('boot')
          if (!b) return
          b.style.display = 'flex'
          document.getElementById('boot-msg').textContent = title
          var d = document.getElementById('boot-detail')
          d.textContent = detail || ''
          d.style.display = detail ? 'block' : 'none'
        }
        window.__aaBootShow = show

        // Capture phase matters: a script or stylesheet that fails to load
        // fires an error event that does NOT bubble, so a plain
        // addEventListener('error') never sees it -- which is exactly how a
        // 404 on the bundle showed up as a silent stall with nothing to go on.
        window.addEventListener('error', function (e) {
          var el = e.target
          if (el && el !== window && (el.src || el.href)) {
            show('FAILED TO LOAD', (el.src || el.href) + '\n\nThe browser could not load this file. It may be missing on the server, or blocked by an extension or content blocker.')
            return
          }
          show('SCRIPT ERROR', (e.error && e.error.stack) || e.message || String(e))
        }, true)

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('SCRIPT ERROR', (r && r.stack) || String(r))
        })

        // If nothing mounted, ask the server about the bundle directly and put
        // the answer on screen: status code, content type, or a network error
        // if something is blocking it outright.
        setTimeout(function () {
          if (window.__aaMounted || shown) return
          var el = document.querySelector('script[type="module"]')
          var src = el && el.src
          var waited = Math.round((Date.now() - t0) / 1000) + 's'
          if (!src) {
            show('STALLED', 'No module script tag found in the page after ' + waited + '.')
            return
          }
          fetch(src, { cache: 'no-store' })
            .then(function (r) {
              show(
                r.ok ? 'BUNDLE LOADED BUT DID NOT RUN' : 'BUNDLE HTTP ' + r.status,
                src +
                  '\n\nstatus       : ' + r.status + ' ' + r.statusText +
                  '\ncontent-type : ' + r.headers.get('content-type') +
                  '\nwaited       : ' + waited +
                  (r.ok
                    ? '\n\nThe file is reachable, so it was fetched but never executed. A content blocker or an extension is the usual cause.'
                    : '\n\nThe file is not being served at this URL.')
              )
            })
            .catch(function (err) {
              show('BUNDLE UNREACHABLE', src + '\n\n' + err + '\nwaited: ' + waited +
                '\n\nThe request itself failed, which usually means an extension, content blocker or network policy is blocking it.')
            })
        }, 10000)
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
