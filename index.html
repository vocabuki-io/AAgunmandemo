<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA GUNMAN</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07060a; }
      body { font-family: "Courier New", ui-monospace, monospace; color: #e9dfc8; cursor: crosshair; }
      canvas { display: block; }
      #boot {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 32px;
        text-align: center; letter-spacing: 0.1em; background: #07060a;
      }
      #boot-title { font-size: 12px; letter-spacing: 0.5em; color: #ff2f9e; }
      #boot-msg { font-size: 22px; color: #e9dfc8; }
      #boot-detail {
        display: none; max-width: 760px; max-height: 260px; overflow: auto;
        text-align: left; font-size: 11px; line-height: 1.6; color: #8d7f67;
        background: #120e15; border: 1px solid #33291f; padding: 14px;
        white-space: pre-wrap; word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot fallback. A module-level throw or a bundle that never executes
         leaves #root empty and the page simply black, with nothing to report.
         This says what happened instead. main.tsx removes it on mount. -->
    <div id="boot">
      <div id="boot-title">AA GUNMAN</div>
      <div id="boot-msg">LOADING…</div>
      <pre id="boot-detail"></pre>
    </div>
    <script>
      (function () {
        var shown = false
        function show(title, detail) {
          if (shown) return
          shown = true
          var b = document.getElementById('boot')
          if (!b) return
          b.style.display = 'flex'
          document.getElementById('boot-msg').textContent = title
          var d = document.getElementById('boot-detail')
          d.textContent = detail || ''
          d.style.display = detail ? 'block' : 'none'
        }
        window.__aaBootShow = show
        window.addEventListener('error', function (e) {
          show('SCRIPT ERROR', (e.error && e.error.stack) || e.message || String(e))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show('SCRIPT ERROR', (r && r.stack) || String(r))
        })
        setTimeout(function () {
          if (!window.__aaMounted) {
            show('STALLED', 'The bundle did not finish starting within 10s. Check the Network and Console tabs of the developer tools.')
          }
        }, 10000)
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
